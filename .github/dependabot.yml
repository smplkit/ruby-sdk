# Dependabot for ruby-sdk.
#
# Every dependency bump is a `fix:` — a version change is a real
# change to the release inputs and warrants a new patch publish via
# semantic-release. Per the SDK commit-message lockdown in
# ~/.claude/CLAUDE.md, `fix:` is the maximum bump permitted.
#
# All Bundler gems go in one weekly group. Major bumps land as
# individual PRs.
#
# Patch + minor bumps auto-merge on green CI via the sibling
# .github/workflows/dependabot-auto-merge.yml workflow.

version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    open-pull-requests-limit: 10
    # SDK floor protection: widen the existing range rather than
    # replacing it. For `~> X.Y` and `>= X, < Y` constraints in the
    # gemspec, a new major causes Dependabot to widen the range so
    # consumers on either the old or new major can still install
    # the gem. Without this, Dependabot would replace the gemspec
    # constraint and silently lock out customers on older versions.
    versioning-strategy: widen
    groups:
      bundler:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types:
          - minor
          - patch
