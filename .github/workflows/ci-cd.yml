name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      manual_version:
        description: "Force version"
        required: false
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Test
        run: bundle exec rspec

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-min-floor:
    name: Test (minimum dependency floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run on the minimum supported Ruby (required_ruby_version >= 3.1).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Pin runtime deps to their declared floor and install
        run: |
          # Bundler resolves to the HIGHEST satisfying version, so the normal
          # suite never exercises the floor we publish. scripts/floor_gemfile.rb
          # pins each customer-facing runtime gem to the lowest published
          # version satisfying its gemspec constraint, proving the floors are
          # real and not aspirational.
          ruby scripts/floor_gemfile.rb
          BUNDLE_GEMFILE=Gemfile.floor bundle install --jobs 4

      - name: Test against the declared floor
        run: BUNDLE_GEMFILE=Gemfile.floor bundle exec rspec -Ilib

  ci-gate:
    if: always()
    needs: [lint, test, test-min-floor]
    runs-on: ubuntu-latest
    steps:
      - uses: smplkit/.github-public/actions/ci-gate@main
        with:
          needs: ${{ toJson(needs) }}

  release:
    needs: [ci-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: prep
        uses: smplkit/.github-public/actions/sdk-release-prepare@main
        with:
          manual_version: ${{ github.event.inputs.manual_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ruby/setup-ruby@v1
        if: steps.prep.outputs.released == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build gem
        if: steps.prep.outputs.released == 'true'
        env:
          # The gemspec derives its version from `git describe --tags`, but we
          # also pass the version explicitly so the manual_version dispatch
          # path (which can produce a tag the workflow itself just created)
          # always picks up the right value before the cache settles.
          SMPLKIT_GEM_VERSION: ${{ steps.prep.outputs.version }}
        run: gem build smplkit.gemspec

      - name: Publish to RubyGems
        if: steps.prep.outputs.released == 'true'
        env:
          SMPLKIT_GEM_VERSION: ${{ steps.prep.outputs.version }}
        uses: rubygems/release-gem@v1
        with:
          # The action's experimental sigstore-attestation support preloads
          # (via RUBYOPT) code that activates the runner Ruby's DEFAULT
          # openssl before bundler/setup runs. The bundle now resolves the
          # openssl GEM at a newer version (io-stream >= 0.13 declares
          # `openssl >= 3.3`, which bundler satisfies with openssl 4.x), so
          # the preloaded default clashes with the bundled gem and
          # `bundle exec rake release` aborts with Gem::LoadError. Disable
          # the experimental preload until the upstream action tolerates a
          # bundled openssl newer than the runner default.
          attestations: "false"

      - name: Summary
        run: |
          echo "## Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.prep.outputs.released }}" = "true" ]; then
            echo "**Version:** v${{ steps.prep.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Published to RubyGems:** yes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release warranted by commits since last release." >> "$GITHUB_STEP_SUMMARY"
          fi
